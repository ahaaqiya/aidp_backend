app.id=zzccaidp
spring.application.name=zzccimp-aidp
# 兼容原 bades 工程：允许循环依赖（aidpDocumentService <-> ragFlowServiceImpl）
spring.main.allow-circular-references=true
server.port=8080
server.servlet.context-path=/zzccaidp

# springfox 兼容 Spring Boot 2.6+（否则 swagger 启动报错）
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ---------------- 数据库（本地） ----------------
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/zylcaidp?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=micro
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- Redis（本地 Docker Valkey） ----------------
spring.redis.host=127.0.0.1
spring.redis.port=6379
spring.redis.database=0
spring.redis.timeout=5000
spring.redis.password=${REDIS_PASSWORD:}

# ---------------- MyBatis / tk.mybatis ----------------
mybatis.config-location=classpath:mybatis-config.xml
mybatis.mapper-locations=com/zzccaidp/**/mapper/**/*Mapper.xml
mapper.enumAsSimpleType=true
mapper.basePackage=com.zzccaidp.mapper.system,com.zzccaidp.mapper.ai,com.zzccaidp.mapper.datasource,com.zzccaidp.mapper.knowledgebase,com.zzccaidp.mapper.agent

# ---------------- AWS S3（原 bades.file.aws-s3.*，本地使用 MinIO 替代） ----------------
bades.file.aws-s3.bucketName=contract-review-files
aws.s3.accessKey=${S3_ACCESS_KEY:}
aws.s3.secretKey=${S3_SECRET_KEY:}
aws.s3.endpoint=http://localhost:9000
aws.s3.region=us-east-1

# ---------------- 系统杂项（原 Apollo 下发） ----------------
# SSOC 本地桩：免密登录默认放行的用户
ssoc.stub.enabled=true
ssoc.stub.user-id=admin
maxFile.size=5MB
login.sessionTime=600000
aidp.headphoto.path=/data/aidp/headphoto/
aidp.bigicon.path=/data/aidp/bigicon/
bades.AgentDialogur.appKey=changeme
datasource.password.sm2.pubKey=changeme
aws.uploadConfigPath=config/

# ---------------- 文档平台集成 ----------------
documentPlatform.forDownload.url=http://127.0.0.1/download
documentPlatform.accessKey=changeme
documentPlatform.secretKey=changeme
documentPlatform.endpoint=http://127.0.0.1
documentPlatform.getPreviewUrl.uri=/api/preview/url

# ---------------- 文档推送开放接口 ----------------
# 文档推送开放接口 HMAC 签名共享密钥（签名算法见 AidpDocumentOpenController，调用方与服务端各持一份，生产环境务必修改）
aidp.open.api-key=${AIDP_OPEN_API_KEY:}
# 单次推送文档数量上限（同步逐条处理，超限需分批推送，防止长时间阻塞与下游被打爆）
aidp.open.max-doc-count=100

# 附件最大限制
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# AIDP调用超时时间
server.tomcat.connection-timeout=600s
server.tomcat.keep-alive-timeout=600s

# ---------------- 凭据注入说明（本文件不存放任何明文密钥） ----------------
# 以下 5 项凭据均通过环境变量注入，未注入时为空值：
#   DB_PASSWORD        MySQL 密码
#   REDIS_PASSWORD     Redis 密码
#   S3_ACCESS_KEY      S3/MinIO accessKey
#   S3_SECRET_KEY      S3/MinIO secretKey
#   AIDP_OPEN_API_KEY  文档推送开放接口 HMAC 共享密钥
# 本地开发：新建本目录下 application-local.properties 填入以上键的真实值
# （该文件已被 .gitignore 忽略），启动时激活 local profile：
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
# profile 专属配置优先级高于本文件，可正常覆盖占位符。

